<style>
/* ============ RESET & TOKENS ============ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#060608;--bg2:#0b0b12;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.075);
  --stroke:rgba(255,215,130,.16);--stroke2:rgba(255,215,130,.35);
  --gold:#f5c542;--gold2:#ffdf8e;--gold3:#b8860b;--txt:#f4f1ea;--mut:#9a958a;
  --acc1:#f5c542;--acc2:#ff9f1a;--glow:0 0 24px rgba(245,197,66,.35);
  --rad:20px;--shadow:0 20px 60px rgba(0,0,0,.55);--top:64px;--bot:78px;
  --f-display:'Orbitron',system-ui,sans-serif;--f-body:'Rajdhani',system-ui,sans-serif;
}
html[data-accent="blue"]{--acc1:#3ea6ff;--acc2:#1e5eff;--glow:0 0 24px rgba(62,166,255,.35);--stroke:rgba(120,190,255,.16);--stroke2:rgba(120,190,255,.4)}
html[data-accent="red"]{--acc1:#ff4d4d;--acc2:#c20e0e;--glow:0 0 24px rgba(255,77,77,.35);--stroke:rgba(255,130,130,.16);--stroke2:rgba(255,130,130,.4)}
html[data-accent="emerald"]{--acc1:#2ee6a8;--acc2:#0aa86f;--glow:0 0 24px rgba(46,230,168,.35);--stroke:rgba(110,255,200,.16);--stroke2:rgba(110,255,200,.4)}
html[data-accent="purple"]{--acc1:#b45cff;--acc2:#6f1eff;--glow:0 0 24px rgba(180,92,255,.35);--stroke:rgba(200,150,255,.16);--stroke2:rgba(200,150,255,.4)}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--f-body);font-size:16px;line-height:1.55;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(1100px 700px at 85% -10%,rgba(245,197,66,.10),transparent 60%),
  radial-gradient(900px 700px at -10% 110%,rgba(255,159,26,.07),transparent 60%),
  radial-gradient(700px 500px at 50% 50%,rgba(255,255,255,.02),transparent 70%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 75%)}
::selection{background:var(--acc1);color:#000}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0a0a0f}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--acc1),var(--acc2));border-radius:99px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea,select{font-family:inherit;color:var(--txt);width:100%}
:focus-visible{outline:2px solid var(--acc1);outline-offset:3px;border-radius:6px}
.skip{position:fixed;top:-60px;left:12px;z-index:9999;background:var(--acc1);color:#000;padding:10px 18px;border-radius:0 0 12px 12px;font-weight:700;transition:top .25s}
.skip:focus{top:0}
.gold-text{background:linear-gradient(120deg,#f8e08e,var(--acc1) 38%,var(--acc2) 62%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
body.no-anim *,body.no-anim *::before,body.no-anim *::after{animation:none!important;transition:none!important}

/* ============ SPLASH ============ */
#splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(900px 600px at 50% 30%,rgba(245,197,66,.08),transparent 60%),var(--bg);transition:opacity .6s ease,visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
.splash-logo{font-family:var(--f-display);font-size:clamp(34px,9vw,64px);font-weight:900;letter-spacing:4px;text-align:center;animation:pop 1.1s cubic-bezier(.2,1.4,.4,1) both}
.splash-logo .bolt{display:inline-block;animation:boltPulse 1.4s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0;filter:blur(12px)}100%{transform:scale(1);opacity:1;filter:blur(0)}}
@keyframes boltPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 8px rgba(245,197,66,.8))}50%{transform:scale(1.18) rotate(-6deg);filter:drop-shadow(0 0 22px rgba(245,197,66,1))}}
.splash-sub{font-size:13px;letter-spacing:5px;color:var(--mut);text-transform:uppercase;animation:fadeUp .9s .3s both}
.splash-bar{width:min(280px,70vw);height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.splash-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc1),var(--gold2));box-shadow:var(--glow);transition:width .25s ease}
.splash-txt{font-size:11px;letter-spacing:3px;color:var(--mut);text-transform:uppercase}
.splash-ring{width:52px;height:52px;border-radius:50%;border:3px solid rgba(255,255,255,.08);border-top-color:var(--acc1);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ LAYOUT ============ */
#topbar{position:fixed;top:0;left:0;right:0;z-index:90;height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(6,6,8,.65);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--stroke)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;letter-spacing:2px;font-size:16px}
.logo-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,rgba(245,197,66,.18),rgba(255,159,26,.08));border:1px solid var(--stroke2);box-shadow:var(--glow);animation:logoFloat 4s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.top-acts{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:17px;background:var(--panel);border:1px solid var(--stroke);backdrop-filter:blur(12px);transition:.25s}
.icon-btn:hover{border-color:var(--stroke2);box-shadow:var(--glow);transform:translateY(-2px)}
#app{padding:calc(var(--top) + 18px) 16px calc(var(--bot) + 24px);max-width:1100px;margin:0 auto;min-height:100vh}
#bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:90;height:var(--bot);display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);background:rgba(6,6,8,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--stroke)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;letter-spacing:1px;color:var(--mut);padding:8px 18px;border-radius:14px;transition:.25s;position:relative;text-transform:uppercase;font-weight:700}
.nav-item .ni{font-size:19px;line-height:1;transition:.25s}
.nav-item.on{color:var(--acc1)}
.nav-item.on .ni{transform:translateY(-2px) scale(1.12);filter:drop-shadow(0 0 8px rgba(245,197,66,.7))}
#toTop{position:fixed;right:16px;bottom:calc(var(--bot) + 20px);z-index:80;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#000;box-shadow:var(--glow);opacity:0;visibility:hidden;transform:translateY(14px);transition:.35s}
#toTop.show{opacity:1;visibility:visible;transform:none}

/* ============ BUTTONS ============ */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 26px;border-radius:15px;font-weight:700;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;transition:transform .2s,box-shadow .2s,background .2s;user-select:none}
.btn:active{transform:scale(.96)}
.btn-gold{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#0a0a05;box-shadow:var(--glow)}
.btn-gold:hover{box-shadow:0 0 34px rgba(245,197,66,.55);transform:translateY(-2px)}
.btn-ghost{background:var(--panel);border:1px solid var(--stroke2);color:var(--txt);backdrop-filter:blur(12px)}
.btn-ghost:hover{border-color:var(--acc1);box-shadow:var(--glow)}
.btn-danger{background:linear-gradient(135deg,#ff5f5f,#b31313);color:#fff;box-shadow:0 0 22px rgba(255,60,60,.3)}
.btn-block{width:100%}
.btn-sm{padding:9px 15px;font-size:12px;border-radius:11px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
#cta{font-size:clamp(15px,4vw,18px);padding:19px 44px;border-radius:18px;animation:ctaPulse 2.4s ease-in-out infinite}
@keyframes ctaPulse{0%,100%{box-shadow:0 0 22px rgba(245,197,66,.35)}50%{box-shadow:0 0 46px rgba(245,197,66,.75)}}

/* ============ CARDS & GRIDS ============ */
.glass{background:var(--panel);border:1px solid var(--stroke);border-radius:var(--rad);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.card{padding:22px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--acc1),transparent);opacity:.7}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.pick-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:15px 8px;border-radius:16px;background:var(--panel);border:1px solid var(--stroke);cursor:pointer;transition:.25s;text-align:center;min-height:84px}
.pick-card .pc-ic{font-size:24px;transition:.25s}
.pick-card span{font-weight:700;font-size:13px;letter-spacing:.4px}
.pick-card:hover{border-color:var(--stroke2);transform:translateY(-4px);box-shadow:var(--glow)}
.pick-card.on{border-color:var(--acc1);background:linear-gradient(160deg,rgba(245,197,66,.14),rgba(255,159,26,.05));box-shadow:var(--glow)}
.pick-card.on .pc-ic{transform:scale(1.2);filter:drop-shadow(0 0 10px rgba(245,197,66,.8))}
.mono{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;background:linear-gradient(135deg,rgba(245,197,66,.16),rgba(255,159,26,.06));border:1px solid var(--stroke2);color:var(--gold2)}
.hero{padding:34px 22px;text-align:center;margin-bottom:14px}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,8vw,58px);letter-spacing:3px;line-height:1.12;animation:fadeUp .8s both}
.hero .tag{display:inline-block;margin-top:14px;padding:8px 18px;border-radius:99px;background:rgba(245,197,66,.09);border:1px solid var(--stroke2);color:var(--gold2);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;animation:fadeUp .8s .15s both}
.hero p{color:var(--mut);max-width:560px;margin:16px auto 0;font-size:16px;animation:fadeUp .8s .3s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.float{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.sec-title{font-family:var(--f-display);font-weight:800;font-size:clamp(18px,4.5vw,26px);letter-spacing:2px;margin:34px 0 16px;display:flex;align-items:center;gap:10px}
.sec-title::before{content:"";width:28px;height:2px;background:linear-gradient(90deg,var(--acc1),transparent)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;background:var(--panel);border:1px solid var(--stroke);font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--mut)}
.chip.gold{color:var(--gold2);border-color:var(--stroke2);background:rgba(245,197,66,.08)}

/* ============ STEPS / PROGRESS ============ */
.steps{display:flex;align-items:center;gap:6px;margin:18px 0 22px;overflow-x:auto;padding:4px 2px}
.step-dot{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.step-dot .sd{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--stroke);font-size:11px;transition:.3s}
.step-dot.on{color:var(--gold2)}
.step-dot.on .sd{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#000;border-color:transparent;box-shadow:var(--glow)}
.step-dot.done .sd{background:rgba(245,197,66,.15);border-color:var(--stroke2);color:var(--gold2)}
.step-line{flex:1;min-width:14px;height:2px;background:var(--stroke);border-radius:2px}
.step-line.done{background:linear-gradient(90deg,var(--acc1),var(--acc2));box-shadow:var(--glow)}
.step-title{font-family:var(--f-display);font-size:clamp(17px,4.5vw,24px);font-weight:800;letter-spacing:1.5px;margin-bottom:6px}
.step-sub{color:var(--mut);font-size:14px;margin-bottom:20px}
.model-input{padding:16px 18px;border-radius:15px;background:var(--panel);border:1px solid var(--stroke);font-size:16px;font-weight:600;letter-spacing:.5px;transition:.25s;backdrop-filter:blur(12px)}
.model-input:focus{border-color:var(--acc1);box-shadow:var(--glow);outline:none}
.lock-card{text-align:center;padding:40px 24px}
.lock-ic{width:86px;height:86px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;font-size:40px;background:linear-gradient(160deg,rgba(245,197,66,.16),rgba(255,159,26,.05));border:1px solid var(--stroke2);box-shadow:var(--glow);animation:lockFloat 3.5s ease-in-out infinite}
@keyframes lockFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(-3deg)}}
.flow-back{display:inline-flex;align-items:center;gap:8px;color:var(--mut);font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;padding:9px 16px;border-radius:12px;border:1px solid var(--stroke);background:var(--panel);transition:.25s;margin-bottom:14px}
.flow-back:hover{color:var(--gold2);border-color:var(--stroke2)}

/* ============ MODAL / TOASTS ============ */
.ov{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,3,5,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fadeIn .25s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:min(420px,100%);padding:28px 24px;position:relative;animation:modalIn .35s cubic-bezier(.2,1.2,.4,1) both}
@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(.92)}to{opacity:1;transform:none}}
.modal .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:11px;background:var(--panel);border:1px solid var(--stroke);font-size:14px;color:var(--mut);transition:.25s}
.modal .x:hover{color:var(--gold2);border-color:var(--stroke2)}
.modal h3{font-family:var(--f-display);font-size:18px;letter-spacing:1.5px;margin:10px 0 6px}
.modal p{color:var(--mut);font-size:14px;margin-bottom:16px}
.pin-input{padding:16px;border-radius:14px;background:rgba(0,0,0,.4);border:1px solid var(--stroke2);font-size:22px;font-weight:700;letter-spacing:8px;text-align:center;transition:.25s}
.pin-input:focus{outline:none;border-color:var(--acc1);box-shadow:var(--glow)}
.pin-input.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.modal-err{border-color:#ff4d4d!important;box-shadow:0 0 20px rgba(255,70,70,.3)!important}
#toasts{position:fixed;top:calc(var(--top) + 12px);left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:10px;align-items:center;width:min(92vw,420px)}
.toast{display:flex;align-items:center;gap:10px;padding:13px 20px;border-radius:15px;background:rgba(10,10,14,.9);border:1px solid var(--stroke2);backdrop-filter:blur(14px);box-shadow:var(--glow);font-weight:700;font-size:14px;letter-spacing:.4px;opacity:0;transform:translateY(-16px) scale(.94);transition:.35s cubic-bezier(.2,1.2,.4,1)}
.toast.show{opacity:1;transform:none}
.toast .t-ic{color:var(--gold2)}

/* ============ RESULT ============ */
.res-head{text-align:center;padding:28px 20px;margin-bottom:16px}
.res-id{font-family:var(--f-display);font-weight:800;font-size:clamp(19px,5vw,28px);letter-spacing:2px}
.res-id::before{content:"#";color:var(--acc2)}
.res-meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.res-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
.res-actions .btn{flex:1;min-width:130px;max-width:200px}
.val-card{text-align:center;padding:18px 12px}
.val-card .big{font-family:var(--f-display);font-size:34px;font-weight:900}
.val-card .lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:8px}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc1));box-shadow:var(--glow);transition:width 1s cubic-bezier(.2,1,.3,1)}
.txt-card{padding:18px 20px}
.txt-card .lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:8px}
.txt-card p{font-size:15px;color:#e8e4da;font-weight:600}
.txt-card ul{list-style:none;margin-top:4px;display:flex;flex-direction:column;gap:7px}
.txt-card li{display:flex;gap:9px;font-size:14px;color:#dcd7cb;font-weight:600}
.txt-card li::before{content:"◆";color:var(--acc1);font-size:10px;align-self:center}
.owner-msg{text-align:center;padding:30px 22px;background:linear-gradient(160deg,rgba(245,197,66,.1),rgba(255,159,26,.03));border-color:var(--stroke2);margin-top:16px}
.owner-msg h4{font-family:var(--f-display);font-size:17px;letter-spacing:1.5px;margin-bottom:10px}
.owner-msg p{color:#e6e1d5;font-size:15px;margin-bottom:6px}
.owner-msg .sign{color:var(--gold2);font-weight:700;letter-spacing:1px;margin-top:10px}
.ctrl-table{width:100%;border-collapse:collapse;font-size:14px}
.ctrl-table th{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1px solid var(--stroke)}
.ctrl-table td{padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.05);font-weight:600}
.ctrl-table .ctrl-ic{display:inline-flex;width:30px;height:30px;border-radius:9px;align-items:center;justify-content:center;background:rgba(245,197,66,.1);border:1px solid var(--stroke2);color:var(--gold2);font-size:12px;font-weight:800}
.code-block{margin-top:12px;padding:14px;border-radius:13px;background:rgba(0,0,0,.45);border:1px solid var(--stroke);font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#c9c2b2;word-break:break-all;line-height:1.7}

function handleAction(el){

      if(p==='library')A.libTab=a||A.libTab||'search';
      go(p,a);break;
    }
    case 'goHome':go('home');break;
    case 'openMore':go('menu');break;
    case 'openFlow':{A.flow=arg;A.step=1;A.brand='';A.model='';A.style='';A.fingers=0;go('flow');break}
    case 'flowBack':A.step=Math.max(1,A.step-1);go('flow');break;
    case 'brand':A.brand=arg;vibrate();A.step=2;go('flow');break;
    case 'modelFill':A.model=arg;toast('Model set: '+arg,'📱');go('flow');break;
    case 'modelNext':{
      const inp=$('#modelInput');const v=(inp?(inp.value||'').trim():'');
      if(!v){toast('Please enter your phone model','⚠️');return}
      A.model=v;vibrate();A.step=3;go('flow');break;
    }
    case 'style':A.style=arg;vibrate();A
      case 'fingers':A.fingers=+arg;vibrate();A.step=5;go('flow');break;
    case 'pinOpen':openModal(pinModalHTML());setTimeout(()=>{const i=$('#pinInput');if(i)i.focus()},120);break;
    case 'pinSubmit':validatePin();break;
    case 'invalidRetry':openModal(pinModalHTML());setTimeout(()=>{const i=$('#pinInput');if(i)i.focus()},120);break;
    case 'closeModal':closeModal();break;
    case 'copyAll':copyResult();break;
    case 'download':downloadResult();break;
    case 'share':shareResult();break;
    case 'fav':{
      const id=A.current.id;
      const on=A.favs.includes(id);
      A.favs=on?A.favs.filter(f=>f!==id):[...A.favs,id];
      persist();vibrate();toast(on?'Removed from favorites':'Saved to favorites',on?'☆':'★');
      go('result',id);break;
    }
    case 'print':printResult();break;
    case 'libTab':A.libTab=arg;go('library',arg);break;
    case 'libOpen':{
      const it=allItems().find(x=>x.id===arg);
      if(it){A.current=it;go('result',it.id)}break;
    }

      go('library',A.libTab||'search');break;
    }
    case 'libDel':{
      A.results.saved=A.results.saved.filter(x=>x.id!==arg);
      A.results.history=A.results.history.filter(x=>x.id!==arg);
      persist();toast('Deleted from library','🗑');
      go('library',A.libTab||'search');break;

    case 'confirmClear':openModal('<h3 class="gold-text">⚠️ CONFIRM</h3><p>This action cannot be undone. Continue?</p><div style="display:flex;gap:10px"><button class="btn btn-danger" data-act="doClear" data-arg="'+arg+'" style="flex:1">Yes, clear</button><button class="btn btn-ghost" data-act="closeModal" style="flex:1">Cancel</button></div>');break;
    case 'doClear':{
      if(arg==='clearHistory')A.results.history=[];
      if(arg==='clearFavs')A.favs=[];
      if(arg==='clearSaved')A.results.saved=[];
      if(arg==='clearAll'){A.results={saved:[],history:[]};A.favs=[]}
      persist();closeModal();toast('Cleared successfully','🧹');
      go('settings');break;

    case 'faq':{
      const item=el.closest('.faq-item');if(!item)break;

      const nm=(n&&n.value.trim())||'Anonymous',msg=(m&&m.value.trim())||'';

/* ============ SETTINGS APPLY ============ */
let accentRGB='245,197,66';
function hexToRgb(h){const m=(h||'').match(/#([0-9a-f]{6})/i);if(!m)return '245,197,66';const n=parseInt(m[1],16);return (n>>16&255)+','+(n>>8&255)+','+(n&255)}
function applySettings(){
  document.documentElement.dataset.accent=A.settings.accent;
  document.body.classList.toggle('no-anim',!A.settings.anim);
  accentRGB=hexToRgb(getComputedStyle(document.documentElement).getPropertyValue('--acc1'));
}

/* ============ PARTICLES ============ */
const cvs=$('#fx'),pctx=cvs.getContext('2d');
let parts=[],W=0,H=0;
function resizeCvs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cvs.width=W*d;cvs.height=H*d;pctx.setTransform(d,0,0,d,0,0)}
function density(){const d=A.settings.particles;return d==='off'?0:d==='light'?28:d==='med'?55:d==='dense'?85:55}
function newP(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.6,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,o:Math.random()*.5+.15}}
function initParts(){parts=[];for(let i=0;i<density();i++)parts.push(newP())}
function tick(){
  requestAnimationFrame(tick);
  pctx.clearRect(0,0,W,H);
  const target=density();
  if(parts.length<target)while(parts.length<target)parts.push(newP());
  if(parts.length>target)parts.length=target;
  parts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;
    if(p.y<-10)p.y=H+10;if(p.y>H+10)p.y=-10;
    pctx.beginPath();pctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    pctx.fillStyle='rgba('+accentRGB+','+p.o+')';
    pctx.shadowColor='rgba('+accentRGB+',.8)';pctx.shadowBlur=6;
    pctx.fill();pctx.shadowBlur=0;
  });
}

function boot(){
  const s=$('#splash'),fill=$('#splashFill'),txt=$('#splashTxt');
  const steps=['LOADING PREMIUM ASSETS','CALIBRATING SENSITIVITY','CHARGING ZEUS CORE','READY FOR BOOYAH'];
  const finish=()=>{s.classList.add('hide');setTimeout(()=>{s.remove();go('home')},650)};
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!A.settings.intro||reduced){fill.style.width='100%';finish();return}
  let p=0,si=0;
  const iv=setInterval(()=>{
    p+=Math.random()*14+6;
    if(p>=100){clearInterval(iv);p=100;fill.style.width='100%';txt.textContent='READY FOR BOOYAH';setTimeout(finish,450);return}
    fill.style.width=p+'%';
    if(p>si*25){txt.textContent=steps[si]||steps[0];si++}
  },170);
  setTimeout(finish,3800);
}

document.addEventListener('input',e=>{
  if(e.target.id==='libSearch'){
    const q=e.target.value.toLowerCase().trim();
    const items=allItems().filter(it=>JSON.stringify({id:it.id,title:it.title,...it.meta}).toLowerCase().includes(q));
    $('#libResults').innerHTML=items.length?items.map(libItemHTML).join(''):emptyHTML('🔍','No matches found','');
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.btn');
  if(!b||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2;
  const sp=document.createElement('span');sp.className='ripple';
  sp.style.width=sp.style.height=d+'px';
  sp.style.left=(e.clientX-r.left-d/2)+'px';sp.style.top=(e.clientY-r.top-d/2)+'px';
  b.appendChild(sp);setTimeout(()=>sp.remove(),650);
});
window.addEventListener('scroll',()=>{const b=$('#toTop');if(!b)return;b.classList.toggle('show',scrollY>420)},{passive:true});
window.addEventListener('offline',()=>toast('You are offline — app keeps working from cache','📴'));
window.addEventListener('online',()=>toast('Back online!','📶'));

/* ============ INIT ============ */
(function init(){
  A.rating=store.get('zeus_rating',0);
  applySettings();
  resizeCvs();initParts();tick();
  window.addEventListener('resize',()=>{resizeCvs();initParts()});
  boot();
})();
</script>
</body>
</html>
